[package]
name = "tokens-collector"
version = "0.2.0"
edition = "2021"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["tokens-core/bundled-sqlite"]

[dependencies]
tokens-core = { path = "vendor/tokens-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"

[dev-dependencies]
serial_test = "3"
